# XcodeGen spec for Aether.xcodeproj (generated, not committed):
#   xcodegen generate
# Everything but the app entry point lives in Packages/AetherKit.
name: Aether
options:
  bundleIdPrefix: dev.razeen
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  AetherKit:
    path: Packages/AetherKit
targets:
  Aether:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: AetherKit
        product: AetherKit
    postBuildScripts:
      - name: Keep a copy of the app
        script: '"$SRCROOT/scripts/keep-app.sh"'
        basedOnDependencyAnalysis: false
        # The log would otherwise hold the build's whole environment, the
        # gateway key with it.
        showEnvVars: false
    settings:
      base:
        PRODUCT_NAME: Aether
        PRODUCT_BUNDLE_IDENTIFIER: dev.razeen.aether
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        # The .aether project type; Xcode adds the generated keys to it.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Aether
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        # Not sandboxed yet: the gateway key is read from the login shell.
        ENABLE_APP_SANDBOX: NO
        # keep-app.sh writes to ~/Applications.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
