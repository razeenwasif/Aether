<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Aether's app icon: six facets, one per workspace, on an obsidian squircle.
       The master for App/Assets.xcassets (scripts/render-icon.mjs renders it). -->
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur2" x="-60%" y="-200%" width="220%" height="500%"><feGaussianBlur stdDeviation="22"/></filter>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#272930"/><stop offset="0.5" stop-color="#15161B"/><stop offset="1" stop-color="#0A0B0E"/></linearGradient>
    <radialGradient id="amb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8E9CE8" stop-opacity="0.3"/><stop offset="1" stop-color="#8E9CE8" stop-opacity="0"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7DD3B0"/><stop offset="0.5" stop-color="#B9A8FF"/><stop offset="1" stop-color="#F2B66D"/></linearGradient>
    <radialGradient id="glint" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="f0" gradientUnits="userSpaceOnUse" x1="512" y1="486" x2="612" y2="338"><stop offset="0" stop-color="#E6ECFF"/><stop offset="1" stop-color="#8EA5EE"/></linearGradient>
    <linearGradient id="f1" gradientUnits="userSpaceOnUse" x1="512" y1="486" x2="713" y2="512"><stop offset="0" stop-color="#CEC3FF"/><stop offset="1" stop-color="#7B69D8"/></linearGradient>
    <linearGradient id="f2" gradientUnits="userSpaceOnUse" x1="512" y1="486" x2="612" y2="686"><stop offset="0" stop-color="#9584EC"/><stop offset="1" stop-color="#43378F"/></linearGradient>
    <linearGradient id="f3" gradientUnits="userSpaceOnUse" x1="512" y1="486" x2="412" y2="686"><stop offset="0" stop-color="#F8D29A"/><stop offset="1" stop-color="#BC7436"/></linearGradient>
    <linearGradient id="f4" gradientUnits="userSpaceOnUse" x1="512" y1="486" x2="311" y2="512"><stop offset="0" stop-color="#B6ECD6"/><stop offset="1" stop-color="#46A080"/></linearGradient>
    <linearGradient id="f5" gradientUnits="userSpaceOnUse" x1="512" y1="486" x2="412" y2="338"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C3D1FF"/></linearGradient>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
