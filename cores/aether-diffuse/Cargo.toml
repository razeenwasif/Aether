[package]
name = "aether-diffuse"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Aether's bridge to Proton's cores — flows and the Nexus client, canvases, scenes and meshes — for Swift through UniFFI."

[lib]
name = "aether_diffuse"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
proton-diffuse = { path = "../proton-diffuse" }
# Straight RGBA in and out of PNGs, for a picture's mask put in its alpha.
proton-raster = { path = "../proton-raster" }
# Model: scenes, and the meshes they name.
proton-scene = { path = "../proton-scene" }
proton-mesh = { path = "../proton-mesh" }
# Model's Edit mode: meshes as polygons.
aether-poly = { path = "../aether-poly" }
# Model's material layers.
aether-layers = { path = "../aether-layers" }
serde = "1"
serde_json = "1"
uniffi = "0.32"
