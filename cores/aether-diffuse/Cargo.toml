[package]
name = "aether-diffuse"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Aether's bridge to proton-diffuse: flows, edits and undo, checks, and the Nexus client, for Swift through UniFFI."

[lib]
name = "aether_diffuse"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
proton-diffuse = { path = "../proton-diffuse" }
# Straight RGBA in and out of PNGs, for a picture's mask put in its alpha.
proton-raster = { path = "../proton-raster" }
serde = "1"
serde_json = "1"
uniffi = "0.32"
