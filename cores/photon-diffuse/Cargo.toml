[package]
name = "photon-diffuse"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Photon's bridge to its cores — flows and the Nexus client, canvases, scenes and meshes, games, designs — for Swift through UniFFI."

[lib]
name = "photon_diffuse"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
proton-diffuse = { path = "../proton-diffuse" }
# Straight RGBA in and out of PNGs, for a picture's mask put in its alpha.
proton-raster = { path = "../proton-raster" }
# Model: scenes, and the meshes they name.
proton-scene = { path = "../proton-scene" }
proton-mesh = { path = "../proton-mesh" }
# Model's Edit mode: meshes as polygons.
photon-poly = { path = "../photon-poly" }
# Model's material layers.
photon-layers = { path = "../photon-layers" }
# Game: games, edited and run.
proton-game = { path = "../proton-game" }
# Design: designs, their pages and their theme.
photon-design = { path = "../photon-design" }
serde = "1"
serde_json = "1"
uniffi = "0.32"
